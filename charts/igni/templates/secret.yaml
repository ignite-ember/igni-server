{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- include "igni.validate" . -}}
{{/*
Only rendered when the chart is asked to own the Secret. Set
`secrets.existingSecret` instead and this file produces nothing — the
better arrangement, because a value in here is a value in your values
file, in the Helm release object stored in the cluster, and in whatever
CI system ran the install.

Empty optional values are omitted rather than written as "".
`SECRET_ENCRYPTION_KEY` is always written: `igni.validate` refuses to
render without it, as the server refuses to start without it.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "igni.secretName" . }}
  labels:
    {{- include "igni.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  SECRET_ENCRYPTION_KEY: {{ .Values.secrets.secretEncryptionKey | quote }}
  {{- with .Values.secrets.secretEncryptionKeysPrevious }}
  SECRET_ENCRYPTION_KEYS_PREVIOUS: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.postgresPassword }}
  POSTGRES_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.smtpPassword }}
  SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.superAdminPasswordHash }}
  SUPER_ADMIN_PASSWORD_HASH: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.metricsToken }}
  METRICS_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.oidcClientSecret }}
  OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.googleClientSecret }}
  OAUTH_GOOGLE_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.scimToken }}
  SCIM_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
