{{/*
The backup CronJob's Postgres image.

From the same registry and path as the API's image unless you name one:
`registry.example.internal/igni/igni-api` gives
`registry.example.internal/igni/postgres:<backup.image.tag>`. That is
where `igni-import` puts the Postgres image every offline bundle carries,
so an air-gapped install that turns backups on pulls from its own
registry. It used to default to `postgres:17.6-alpine`, an unqualified
name and therefore Docker Hub: in a gap, a pull that fails; elsewhere, a
pull from the internet nobody chose.

A string is still accepted, as a full reference, for values files written
before `backup.image` was a map.

Defined here rather than in _helpers.tpl because only this template uses
it, and its refusals apply only when backups are on.
*/}}
{{- define "igni.backupImage" -}}
{{- $image := .Values.backup.image -}}
{{- if kindIs "string" $image -}}
{{- if not $image -}}
{{- fail "backup.image is empty. Leave it out to take Postgres from the registry of image.repository, or set backup.image.repository and backup.image.tag." -}}
{{- end -}}
{{- $image -}}
{{- else -}}
{{- $repo := $image.repository | default "" -}}
{{- if not $repo -}}
{{- $api := .Values.image.repository | default "" -}}
{{- if not (contains "/" $api) -}}
{{- fail "backup.image.repository is required when image.repository has no registry path to take it from: name the Postgres image your cluster pulls, e.g. registry.example.com/igni/postgres. An unqualified name resolves to Docker Hub." -}}
{{- end -}}
{{- $repo = printf "%s/postgres" (regexReplaceAll "/[^/]+$" $api "") -}}
{{- end -}}
{{- $tag := $image.tag | default "" | toString -}}
{{- if or (not $tag) (eq $tag "latest") -}}
{{- fail "backup.image.tag must name a Postgres version, not be empty or `latest`: pg_dump has to be at least your server's version. The offline bundle carries 17.6-alpine." -}}
{{- end -}}
{{- printf "%s:%s" $repo $tag -}}
{{- end -}}
{{- end -}}

{{- if .Values.backup.enabled }}
{{- include "igni.validate" . -}}
{{/*
Nightly `pg_dump`, verified, into a PersistentVolumeClaim you supply:
one run directory per night (`igni-<UTC stamp>/`) holding an archive of
the shared plane, one archive per organisation's own database (every row
of `tenants`, detached ones included; never the tenant template) and a
MANIFEST. The run counts only if every archive verified.

The same script the compose stack runs, invoked with `once` instead of
looping — `files/backup.sh`, a byte-identical copy of
`containers/backup.sh` with a test comparing them. Helm cannot read files
outside a chart directory, so the copy is unavoidable; the drift is not.

Two decisions worth stating.

**Postgres's own image, not ours.** `pg_dump` has to be at least the
server's version, and pinning it to the database rather than to the
application means an upgrade of Postgres does not silently leave a
`pg_dump` behind that refuses to run.

**No storage is created here.** `backup.existingClaim` is required,
because a chart that quietly provisions a volume in whatever the default
StorageClass happens to be is a chart that writes your backups onto the
same disk as your database in some clusters and onto network storage in
others — and you would not know which until you needed one.
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "igni.fullname" . }}-backup
  labels:
    {{- include "igni.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  # UTC, always. A schedule that follows the node's timezone runs twice on
  # one day a year and not at all on another.
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  # A missed run is worth seeing. Kubernetes keeps the last few so
  # `kubectl get jobs` shows whether last night worked.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # If the controller was down, do not start a dump hours late into the
  # middle of a working day.
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "igni.labels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          # Off for the reason api-deployment.yaml spells out: a
          # Service named `redis` here sets `REDIS_PORT=tcp://...`,
          # which the settings model refuses.
          enableServiceLinks: false
          restartPolicy: Never
          serviceAccountName: {{ include "igni.serviceAccountName" . }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
            # The Postgres image's own postgres user. `fsGroup` is what
            # makes the volume writable by it.
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
          containers:
            - name: backup
              image: {{ include "igni.backupImage" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              command: ['/bin/sh', '/scripts/backup.sh', 'once']
              envFrom:
                - configMapRef:
                    name: {{ include "igni.configMapName" . }}
                - secretRef:
                    name: {{ include "igni.secretName" . }}
              env:
                - name: IGNI_BACKUP_DIR
                  value: /backups
                - name: IGNI_BACKUP_RETAIN_DAYS
                  value: {{ .Values.backup.retainDays | quote }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: backups
                  mountPath: /backups
                # The read-only root filesystem again: the script writes
                # each archive's table of contents, and the list of
                # organisations it reads from `tenants`, to /tmp.
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: {{ include "igni.fullname" . }}-backup-script
                defaultMode: 0555
            - name: backups
              persistentVolumeClaim:
                claimName: {{ required "backup.existingClaim is required when backup.enabled is true. Create the PVC yourself: a chart that provisions one in the default StorageClass may put your backups on the same disk as your database." .Values.backup.existingClaim }}
            - name: tmp
              emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "igni.fullname" . }}-backup-script
  labels:
    {{- include "igni.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
data:
  backup.sh: |
{{ .Files.Get "files/backup.sh" | indent 4 }}
{{- end }}
