{{- /*
The licence-integrity volume (docs/licence-file.md, "The clock"). igni server
keeps the deployment's single high-water mark in one small encrypted file here.
It must be writable and persisted. The default is a single api replica with a
ReadWriteOnce claim, which works on every cluster (including kind's local-path
provisioner, which offers only ReadWriteOnce). The file is the single source of
truth, so to run more than one api replica raise api.replicaCount, set
state.persistence.accessMode to ReadWriteMany on an RWX storage class, and writes
are serialised across replicas by a Postgres advisory lock.

Skipped when an existingClaim is given (bring your own PVC) or when state
persistence is disabled (then the mark is per-pod and ephemeral, which only suits
a single-replica evaluation).
*/}}
{{- if and .Values.state.persistence.enabled (not .Values.state.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "igni.fullname" . }}-state
  labels:
    {{- include "igni.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.state.persistence.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.state.persistence.size | quote }}
  {{- with .Values.state.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
