{{- if .Values.serviceAccount.create }}
{{/*
No RoleBinding anywhere in this chart, and none is needed: nothing in
igni talks to the Kubernetes API. The account exists so the pods are not
running as `default` — which in most clusters has been given something by
somebody — and so a cloud identity can be attached to it, which is how
the SES email backend gets AWS credentials on EKS without a stored
secret.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "igni.serviceAccountName" . }}
  labels:
    {{- include "igni.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{/*
Nothing here needs a token mounted into the pod. Off by default so a
compromised container cannot present the pod's identity to the API
server.
*/}}
automountServiceAccountToken: false
{{- end }}
