{{- if .Values.artifacts.enabled }}
{{- include "igni.validate" . -}}
{{/*
The addresses igni__artifacts is deployed with, for its Deployment to
read through `envFrom: [{configMapRef: {name: <this>}}]`.

This chart does not deploy the service — it has its own image, database
and release cycle — but it does own both of the addresses the service
needs, so it renders them rather than asking an operator to type them a
second time and get one wrong:

* PUBLIC_BASE_URL — the service's own URL, on its own host. Its identity:
  the audience every token presented to it must name, and the base igni
  calls for erasure and export. It is the one this chart's second Ingress
  publishes, by construction.
* IGNI_SERVER_BASE_URL — where the service calls igni: the API Service,
  in-cluster. The issuer it compares tokens against is igni's
  PUBLIC_BASE_URL, which it learns from discovery, so this need not equal
  it (igni__artifacts docs/artifacts-and-igni.md).
Its secrets — GRAPH_CREDENTIALS_KEY, POSTGRES_URL, REDIS_URL — are its
own and are not here, and neither is EMBEDDER_URL: the embedder is
igni__artifacts' own image, deployed beside the service, and the service's
Deployment sets it (igni__artifacts docs/running-the-embedder.md).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "igni.fullname" . }}-artifacts-env
  labels:
    {{- include "igni.labels" . | nindent 4 }}
data:
  PUBLIC_BASE_URL: {{ include "igni.artifactsPublicUrl" . | quote }}
  IGNI_SERVER_BASE_URL: {{ include "igni.apiInClusterUrl" . | quote }}
{{- end }}
