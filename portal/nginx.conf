server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend.
    #
    # Resolved per request, not at startup, and that is the whole point
    # of the two lines below. nginx resolves a literal `proxy_pass` host
    # once when it loads its configuration and **exits** if it does not
    # resolve — so this container could not start unless the API was
    # already resolvable. That is fine in a compose stack or a
    # Kubernetes release where both are defined together, and it is not
    # fine anywhere else: bringing up the portal on its own crash-looped
    # with `host not found in upstream`, which reads like a
    # misconfiguration rather than an ordering problem.
    #
    # A variable in `proxy_pass` defers the lookup to request time, so
    # the portal serves the application immediately and answers 502 on
    # /v1 until the API exists.
    #
    # The `resolver` a variable upstream needs is written into conf.d at
    # container start by `docker-entrypoint.d/19-igni-resolver.sh`, from
    # the platform's own /etc/resolv.conf — Docker's embedded DNS in
    # compose, the cluster's in Kubernetes, neither hardcoded. See that
    # script for the two shorter spellings that do not work.
    #
    # `$request_uri` is passed whole: with a variable in `proxy_pass`
    # nginx does no prefix substitution, and the API serves the same
    # `/v1/...` paths this location matches, so unchanged is correct.
    location /v1/ {
        set $api_upstream ${API_UPSTREAM};

        # Match the API's own limit (settings.max_request_body_bytes, 32 MB).
        # Unset, nginx applies its default of 1 MB — so this path silently
        # refused bodies the API would have accepted, and the two halves of
        # the product disagreed about how big a request may be. The API is
        # also reachable directly, which is the path the CLI uses, so the
        # limit has to exist in both places and say the same thing.
        client_max_body_size 32m;
        proxy_pass http://$api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
