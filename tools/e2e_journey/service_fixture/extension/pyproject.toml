[project]
name = "journey-extension"
version = "0.1.0"
description = "The free-base journey's own extension: one tool, over MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["igni-extension>=0.1.0"]

[project.scripts]
# What manifest.json's `python.entry` names: igni starts this.
journey-extension = "journey_extension:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/journey_extension"]
