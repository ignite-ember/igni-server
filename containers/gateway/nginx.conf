# The local edge for igni's own host, as the Helm ingress's first rule is
# in production. Everything on :7777 goes to igni__api.
#
# It sits on :7777, where the API used to be published, so anything already
# configured with `api_url=http://localhost:7777` keeps working.
#
# Nothing here routes to another service: every service has its own host,
# locally as in production. A service's URL is its
# identity — the audience of its tokens, and where igni calls it for
# erasure and export — so it cannot be a path on igni's.
#
# Kept deliberately thin. It routes and nothing else — no auth, no rewriting.

# Variables in proxy_pass defer DNS to request time, so the gateway starts
# even if a backend is still coming up, instead of refusing to boot.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 7777;

    # The API's own limit. nginx's default of 1 MB once silently refused
    # bodies the API would have accepted (see charts/igni/templates/ingress.yaml).
    client_max_body_size 32m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Upgrades pass through, for any WebSocket the API serves.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # The notifications feed is server-sent events; buffering would hold
    # each event until the buffer filled.
    proxy_buffering off;
    proxy_read_timeout 3600s;

    # The two larger bodies, both a service uploading what it ships. The
    # extension bundle carries a wheelhouse for three platforms, and the
    # API allows it 400 MiB (app/main.py).
    location ~ ^/v1/clients/[^/]+/extension$ {
        client_max_body_size 400m;
        set $api igni_api:7777;
        proxy_pass http://$api$request_uri;
    }

    # An asset the extension runs — a JRE, a database, a model — up to
    # 1 GiB, as the API allows on this route (MAX_ASSET_BYTES). Passed on
    # as it arrives rather than spooled to a temp file first: the API
    # streams it into the database itself, and refuses it the moment it
    # passes the size its signature claims.
    location ~ "^/v1/clients/[^/]+/extension/assets/[0-9a-f]{64}$" {
        client_max_body_size 1024m;
        proxy_request_buffering off;
        client_body_timeout 300s;
        proxy_send_timeout 3600s;
        set $api igni_api:7777;
        proxy_pass http://$api$request_uri;
    }

    location / {
        set $api igni_api:7777;
        proxy_pass http://$api$request_uri;
    }
}
