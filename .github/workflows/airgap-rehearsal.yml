name: Air-gap rehearsal

# T11. The free base installed from its offline bundle on a kind cluster
# that cannot reach the internet, then the journey, then a report of
# every attempt anything in the cluster made to leave it. A run fails
# if any workload tried. docs/AIR_GAP_REHEARSAL.md.
#
# Weekly and on demand rather than on every pull request. It takes about
# a quarter of an hour, and what it catches (a new default that phones
# home, an image the bundle does not carry) arrives with a dependency
# or a chart change, not with most pull requests.
#
# The bundle is sealed with a TEST minisign key generated during the
# run. cosign and syft are not installed here, so the images go into the
# bundle unsigned and igni-import checks the bundle signature and every
# hash, but not the image signatures. Run it on a laptop with both
# installed for the cosign half.

on:
  schedule:
    # Mondays 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    name: Install from the bundle with no egress
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The CLI branch this server branch goes with, as ci.yml's journey.
      IGNI_CLI_REF: main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: igni__server

      # Beside the server, where the script looks for it (IGNI_CLI
      # defaults to ../igni). Public, so the job's own token reads it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ignite-ember/igni
          ref: ${{ env.IGNI_CLI_REF }}
          path: igni

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      # The CLI pins its own Python (3.12); uv fetches it.
      - name: Install the CLI
        working-directory: igni
        run: uv sync

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.2

      - name: Install kind, skopeo and minisign
        run: |
          set -euo pipefail
          VERSION=v0.33.0
          curl -sSfLo /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${VERSION}/kind-linux-amd64"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo minisign
          kind version

      - name: Rehearse
        working-directory: igni__server
        env:
          IGNI_AIRGAP_WORK: ${{ runner.temp }}/airgap
        run: tools/airgap-rehearsal.sh

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: airgap-rehearsal-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/airgap/report
            ${{ runner.temp }}/airgap/capture
          retention-days: 30
