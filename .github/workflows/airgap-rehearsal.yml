name: Air-gap rehearsal

# T11. The free base installed from its offline bundle on a kind cluster
# that cannot reach the internet, then the journey, then a report of
# every attempt anything in the cluster made to leave it. A run fails
# if any workload tried. docs/AIR_GAP_REHEARSAL.md.
#
# Weekly and on demand rather than on every pull request. It takes about
# a quarter of an hour, and what it catches (a new default that phones
# home, an image the bundle does not carry) arrives with a dependency
# or a chart change, not with most pull requests.
#
# The bundle is sealed with a TEST cosign key generated during the run.
# syft is not installed here, so the images go into the bundle unsigned
# and igni-import checks the bundle signature and every hash, but not the
# image signatures. Run it on a laptop with syft installed for that half.

on:
  schedule:
    # Mondays 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    name: Install from the bundle with no egress
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The CLI branch this server branch goes with, as ci.yml's journey.
      IGNI_CLI_REF: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: igni-server

      # Beside the server, where the script looks for it (IGNI_CLI
      # defaults to ../igni-core). Public, so the job's own token reads it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ignite-ember/igni-core
          ref: ${{ env.IGNI_CLI_REF }}
          path: igni-core

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # The CLI pins its own Python (3.12); uv fetches it.
      - name: Install the CLI
        working-directory: igni-core
        run: uv sync

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.2

      # The cosign release CD signs with; it signs and verifies the bundle.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.4.1

      - name: Install kind and skopeo
        run: |
          set -euo pipefail
          VERSION=v0.33.0
          # The runner image ships kind, and this is its version; downloaded
          # only when the image moves on. GitHub's release downloads answer
          # 504 for long stretches (hours on 2026-11-08), so not every run
          # should depend on them.
          if [ "$(kind version 2>/dev/null | awk '{print $2}')" != "${VERSION}" ]; then
            curl -sSfL --retry 6 --retry-delay 10 --retry-all-errors -o /tmp/kind \
              "https://github.com/kubernetes-sigs/kind/releases/download/${VERSION}/kind-linux-amd64"
            sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          kind version

      - name: Rehearse
        working-directory: igni-server
        env:
          IGNI_AIRGAP_WORK: ${{ runner.temp }}/airgap
        run: tools/airgap-rehearsal.sh

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: airgap-rehearsal-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/airgap/report
            ${{ runner.temp }}/airgap/capture
          retention-days: 30
