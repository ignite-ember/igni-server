name: CD

on:
  push:
    branches: [main]

# The tests, on the commit that reached main. Nothing is built, pushed,
# signed or uploaded here, and no environment or secret is used: this is
# a public repository, a CI artefact of a public repository is
# downloadable by any signed-in GitHub user, and a release bundle carries
# the paid module images (S27). Releases are built by
# .github/workflows/release.yml, which runs only when the private
# repository ignite-ember/igni__release calls it, and which refuses a
# commit this workflow has not passed. docs/RELEASING.md.
#
# The dev and stage branches and their images are gone: nothing deployed
# them once the Google Cloud projects went.
permissions:
  contents: read

# A newer push to main supersedes an older one's run. A commit whose run
# was cancelled has not passed, so it cannot be released; release the
# newer one.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing tested the commit being built. `ci.yml` is `pull_request`-only,
  # so CI ran against the PR head rather than the merge result, and a
  # direct push to main ran nothing at all — the image reached the
  # registry tagged `latest` with no suite having passed on it. F74. This
  # run's success on a commit is what release.yml checks before it builds
  # anything.
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml
