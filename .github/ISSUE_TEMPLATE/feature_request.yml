name: Feature request
description: Suggest a change to igni server.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
  - type: textarea
    id: alternatives
    attributes:
      label: What you have tried instead
