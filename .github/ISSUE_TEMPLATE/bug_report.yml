name: Bug report
description: Something in igni server does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go to SECURITY.md, not here. Please remove secrets, tokens and personal data from anything you paste.
  - type: input
    id: version
    attributes:
      label: Version
      description: What `GET /version` returns, or the image tag.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How it is deployed
      options: [Helm chart, Docker Compose, From source, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: A request or a sequence of steps. A curl that shows it is the most useful thing.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
