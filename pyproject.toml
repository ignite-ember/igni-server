[project]
name = "ember_server"
version = "0.7.0"
description = "Backend server for AI-powered IDE integration, GitHub/GitLab webhooks, and async task processing"

readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = "==3.13.*"

dependencies = [
    "alembic>=1.14.1",
    "aiosmtplib>=3.0.0",
    # For the SES email transport. A hard dependency rather than an
    # extra: it is ~15 MB, and making it optional means a deployment
    # that sets email_backend=ses discovers the mistake as an
    # ImportError inside a background task, which is where email
    # failures are least visible.
    "boto3>=1.35.0",
    "fastapi>=0.115.8",
    "httpx>=0.28.1",
    # `/metrics`. Was present transitively through flower, and made
    # direct because relying on a transitive dependency for an endpoint a
    # customer's monitoring scrapes is how it disappears in an unrelated
    # upgrade.
    #
    # DEC-13 removed flower, so that transitive source is gone — which is
    # exactly the case this comment was written about, arriving as a
    # decision rather than an upgrade. `/metrics` still works because the
    # dependency was made direct before it mattered.
    #
    # Pure Python, no dependencies of its own, and no egress — it renders
    # text, it does not ship it anywhere.
    "prometheus-client>=0.20.0",
    "pydantic-settings>=2.8.0",
    "pydantic==2.14.2",
    "pydantic_core==2.50.2",
    "pydantic[email]==2.14.2",
    "redis>=5.2.0",
    "uvicorn[standard]>=0.34.0",
    "cachetools>=6.2.2",
    # Declared, having been imported by forty-nine modules and required
    # by nothing. It arrived transitively through alembic, which is the
    # hazard the prometheus-client note above describes — landing on the
    # ORM this entire application is built on. The day alembic changes
    # what it depends on, this stops installing.
    #
    # `[asyncio]` because every session here is async. That extra is
    # also what requires greenlet, so the explicit pin below is now a
    # second place naming one version; left alone rather than removed in
    # the same change, since nothing here is broken by it.
    "sqlalchemy[asyncio]>=2.0.40,<2.2",
    "psycopg2-binary==2.9.13",
    "asyncpg>=0.30.0",
    "python-multipart>=0.0.20",
    "cryptography>=42.0.0",
    "gevent>=25.9.1",
    "greenlet>=3.0.0",
    "tenacity>=9.0.0",
    "pyyaml>=6.0.0",
    "python-socketio>=5.11.0",
    "aioredis>=2.0.1",
    "tiktoken>=0.9.0",
    "bcrypt>=4.0.0",
    "aiohttp>=3.10.0",
    # OpenTelemetry, to the customer's own collector and nowhere else
    # (app/observability/otel.py, docs/observability.md). Normal
    # dependencies rather than an extra because the image is built with
    # `uv sync --no-dev` and an operator turns tracing on with an
    # environment variable, not a rebuild. Nothing is exported, and no
    # provider is built, until OTEL_EXPORTER_OTLP_ENDPOINT names a
    # collector: there is no default endpoint. The exporters are allowed
    # by name in tests/test_nothing_phones_home.py, which says why.
    "opentelemetry-sdk>=1.45.2,<1.46",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2,<1.46",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2,<1.46",
    "opentelemetry-instrumentation-fastapi>=0.66b2,<0.67",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2,<0.67",
    "opentelemetry-instrumentation-httpx>=0.66b2,<0.67",
    "pyjwt[crypto]>=2.10",
    # The cloud model providers' own credentials (app/services/ai/providers):
    # a GCP service account or Workload Identity for Vertex AI, an Azure
    # Managed Identity or client secret for Azure OpenAI. AWS needs nothing
    # new — boto3 above signs for Bedrock. Imported only when a backend of
    # that kind is configured, so a vLLM-only or air-gapped deployment never
    # loads them, and neither sends anything until an operator points a
    # backend at that cloud.
    "google-auth>=2.40",
    "azure-identity>=1.23",
]

[dependency-groups]
dev = [
  "black>=26.3.1",
  "ruff==0.17.4",
  "mypy==2.4.1",
  "mypy-extensions==1.2.0",
  "platformdirs==4.14.5",
  "pip-audit==2.10.1",
  "bandit==1.9.4",
  "types-cachetools>=5.0.0",
  "types-pyyaml>=6.0.0",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  # Imported by the suite and by nothing else, and until now installed
  # only because starlette and pydantic-settings happen to require
  # them. Same failure as the undeclared SQLAlchemy, one layer down:
  # three tests that drive the event loop directly and two that read a
  # deployment's `.env` would have stopped collecting on an unrelated
  # upgrade. Dev rather than runtime — the application imports neither.
  "anyio>=4.0.0",
  "python-dotenv>=1.0.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "reaches_outside_on_purpose: the egress guard's own tests; the suite-wide no_egress check stands aside (tests/conftest.py)",
]
#filterwarnings = [
#    "ignore::DeprecationWarning:passlib",
#    "ignore::DeprecationWarning:jose"
#]

[tool.black]
line-length = 120
target-version = ['py312']
skip-string-normalization = true  # Keep single quotes

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", # Errors
    "F", # Pyflakes
    "I", # isort
    "T20", # flake8-print
]
pydocstyle.convention = 'google'

[tool.ruff.lint.per-file-ignores]
# Operator-facing CLIs in tools/ report to stdout — that is their
# interface, not stray debug output. `rotate_secret_key.py` is read by
# whoever is halfway through a key rotation and needs to know which rows
# moved.
"tools/*" = ["T201"]
# Migrations report progress to whoever is watching them run, and data
# migrations embed content verbatim — reflowing an embedded shell script
# to satisfy a line limit would change what gets inserted.
"alembic/versions/*" = ["T201", "E501"]
# The same verbatim content, frozen into an organisation's migration: t0025
# carries the Default group's seed as it was, line for line.
"alembic_tenant/versions/*" = ["E501"]
# ``env.py`` reports the same way, and for the same reason: whoever ran
# ``alembic upgrade`` is watching stdout. It also creates the database
# when it is absent, which is worth announcing.
"alembic/env.py" = ["T201"]

[tool.ruff.lint.isort]
known-local-folder = ["tests", "app", "scripts", "tools"]
split-on-trailing-comma = true
combine-as-imports = true
case-sensitive = false
detect-same-package = true
order-by-type = false  # Sorting of all imported objects (functions, classes, etc.) regardless of their type
force-sort-within-sections = true  # Don't sort straight-style imports before from-style imports.
