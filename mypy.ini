[mypy]
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
plugins = pydantic.mypy

# Ignore missing imports for external libraries without stubs
[mypy-celery.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-google.cloud.storage.*]
ignore_missing_imports = True

[mypy-socketio.*]
ignore_missing_imports = True

[mypy-psycopg2.*]
ignore_missing_imports = True

# SQLAlchemy plugin to help with Column types
[mypy-sqlalchemy.*]
ignore_missing_imports = False

# Ignore assignment errors for SQLAlchemy ORM models
[mypy-app.db.sql.models.*]
disable_error_code = assignment

# Ignore webhook service type issues (pre-existing)
[mypy-app.services.webhooks.*]
disable_error_code = assignment,attr-defined,union-attr

# Ignore webhook endpoint type issues
[mypy-app.api.base_v1.endpoints.webhooks.*]
disable_error_code = arg-type

# Ignore main app type issues (FastAPI app initialization)
[mypy-app.main]
disable_error_code = assignment,attr-defined,arg-type

[mypy-app.config]
disable_error_code = arg-type

[mypy-app.services.portal.user_service]
disable_error_code = misc

[mypy-app.api.base_v1.endpoints.portal.organizations]
disable_error_code = misc
